        .text-gradient {

        }
        .glass-card {
            background: rgba(17, 24, 39, 0.78);
            backdrop-filter: blur(12px);
        }

        .logo-rainbow {
            display: inline-block;
            background: linear-gradient(90deg, #38BDF8, #8B5CF6, #14B8A6, #38BDF8);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logoColorFlow 3s linear infinite, logoFloat 2.4s ease-in-out infinite;
            filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.45));
        }
        .logo-rainbow:hover {
            transform: scale(1.08) rotate(-2deg);
        }
        @keyframes logoColorFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        .animated-border {
            position: relative;
            isolation: isolate;
            overflow: hidden;
        }
        .animated-border::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 1.25rem;
            background: conic-gradient(from 0deg, #38BDF8, #8B5CF6, #14B8A6, #38BDF8);
            animation: borderSpin 4s linear infinite;
            z-index: -2;
        }
        .animated-border::after {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 1.15rem;
            background: #0F172A;
            z-index: -1;
        }
        @keyframes borderSpin {
            to { transform: rotate(360deg); }
        }
        .hero-orbit {
            position: absolute;
            inset: -20px;
            border: 1px dashed rgba(56, 189, 248, 0.45);
            border-radius: 9999px;
            animation: orbitSpin 12s linear infinite;
        }
        .hero-orbit.reverse {
            inset: -36px;
            border-color: rgba(139, 92, 246, 0.35);
            animation-direction: reverse;
            animation-duration: 16s;
        }
        .hero-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 9999px;
            background: #38BDF8;
            box-shadow: 0 0 24px #38BDF8;
        }
        .hero-dot.dot-one { top: 8%; right: 12%; }
        .hero-dot.dot-two { bottom: 10%; left: 12%; background: #8B5CF6; box-shadow: 0 0 24px #8B5CF6; }
        @keyframes orbitSpin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 640px) {
            .hero-orbit {
                inset: -10px;
            }
            .hero-orbit.reverse {
                inset: -18px;
            }
            .hero-dot {
                width: 9px;
                height: 9px;
            }
            .glass-card {
                overflow-wrap: anywhere;
            }
        }

        const App = () => {
            const [selectedProject, setSelectedProject] = useState(null);

            useEffect(() => {
                const handleLinkClick = (e) => {
                    const href = e.currentTarget.getAttribute('href');
                    if (href && href.startsWith('#') && href !== '#') {
                        e.preventDefault();
                        const targetId = href.substring(1);
                        const element = document.getElementById(targetId);
                        if (element) {
                            element.scrollIntoView({ behavior: 'smooth' });
                        }
                    }
                };

                document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                    anchor.addEventListener('click', handleLinkClick);
                });

                return () => {
                    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                        anchor.removeEventListener('click', handleLinkClick);
                    });
                };
            }, []);

            return (
                <div className="antialiased overflow-x-hidden selection:bg-primary selection:text-dark">

                    <ProjectModal project={selectedProject} onClose={() => setSelectedProject(null)} />

            );
        };
